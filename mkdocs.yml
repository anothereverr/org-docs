site_name: Organization Documentation
site_url: ''
repo_url: ''
docs_dir: docs
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - navigation.breadcrumbs
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
plugins:
- search
markdown_extensions:
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
- pymdownx.tabbed
- admonition
- attr_list
- md_in_html
- toc:
    permalink: true
extra_css:
- _assets/custom.css
extra_javascript:
- _assets/pdf_button.js
hooks:
- hooks/edit_wiki_url.py
nav:
- Home: index.md
- Repositories:
  - Oracle Alura Data Science Challenge 1:
    - Home: oracle-alura-data-science-challenge-1/index.md
    - Test Allura 1: oracle-alura-data-science-challenge-1/test-allura-1.md
