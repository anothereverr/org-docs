name: Sync Wikis and Deploy

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — discover wikis but do not commit or deploy'
        type: boolean
        default: false
      repo_filter:
        description: 'Only sync this repo (name or slug). Leave blank for all.'
        type: string
        required: false
      log_level:
        description: 'Log verbosity'
        type: choice
        default: INFO
        options: [DEBUG, INFO, WARNING, ERROR]

# Allow one sync to run at a time. Do NOT cancel in-progress runs —
# queue the next one instead. Canceling mid-sync could leave docs/ in
# a partial state and deploy an incomplete site.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write   # needed by mkdocs gh-deploy to push to gh-pages branch
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC token for Pages deployment

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout the org-docs repository
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN always has contents:write for this repo.
          # GH_PAT is reserved for GitHub API calls and wiki cloning only.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 2. Set up Python with pip caching for faster subsequent runs
      # ----------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ----------------------------------------------------------------
      # 3. Install Python dependencies
      # ----------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 4. Configure git identity and credentials for the push step
      # ----------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config user.name  "wiki-sync-bot"
          git config user.email "wiki-sync-bot@users.noreply.github.com"
          # Embed the token in the remote URL so mkdocs gh-deploy can push to gh-pages.
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      # ----------------------------------------------------------------
      # 5. Run the sync pipeline
      # ----------------------------------------------------------------
      - name: Sync wikis
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          GH_ORG:            ${{ vars.GH_ORG }}
          REPO_FILTER:       ${{ inputs.repo_filter }}
          DRY_RUN:           ${{ inputs.dry_run }}
          LOG_LEVEL:         ${{ inputs.log_level || 'INFO' }}
          MKDOCS_SITE_NAME:  ${{ vars.MKDOCS_SITE_NAME }}
          MKDOCS_SITE_URL:   ${{ vars.MKDOCS_SITE_URL }}
          MKDOCS_REPO_URL:   ${{ vars.MKDOCS_REPO_URL }}
        run: |
          python scripts/sync_wikis.py \
            --org        "$GH_ORG" \
            --docs-dir   docs \
            --cache-dir  wiki_cache \
            --parallelism 4 \
            --log-level  "${LOG_LEVEL:-INFO}"

      # ----------------------------------------------------------------
      # 6. Build MkDocs site directly from the synced docs/ on disk.
      #    We do NOT commit docs/ back to main — the site is always built
      #    fresh from wiki content on each run. This avoids all git race
      #    conditions between the runner and manual developer pushes.
      # ----------------------------------------------------------------
      - name: Build MkDocs site
        if: inputs.dry_run != true
        run: mkdocs build

      # ----------------------------------------------------------------
      # 7. Deploy to GitHub Pages
      #    --no-history keeps gh-pages lean (no accumulating history of
      #    auto-generated content).
      # ----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force --no-history

      # ----------------------------------------------------------------
      # 8. Print a summary to the Actions run page
      # ----------------------------------------------------------------
      - name: Job summary
        if: always()
        run: |
          echo "## Wiki Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Org | \`${{ vars.GH_ORG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ inputs.dry_run || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo filter | ${{ inputs.repo_filter || '(all)' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.MKDOCS_SITE_URL }}" ]; then
            echo "| Site URL | ${{ vars.MKDOCS_SITE_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
