name: Sync Wikis and Deploy

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — discover wikis but do not commit or deploy'
        type: boolean
        default: false
      repo_filter:
        description: 'Only sync this repo (name or slug). Leave blank for all.'
        type: string
        required: false
      log_level:
        description: 'Log verbosity'
        type: choice
        default: INFO
        options: [DEBUG, INFO, WARNING, ERROR]

# Allow one sync to run at a time. Do NOT cancel in-progress runs —
# queue the next one instead. Canceling mid-sync could leave docs/ in
# a partial state and deploy an incomplete site.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write   # commit updated docs/ and mkdocs.yml to main
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC token for Pages deployment

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout the org-docs repository
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the built-in GITHUB_TOKEN for checkout/push.
          # It always has contents:write for this repo (declared in permissions above).
          # GH_PAT is reserved for GitHub API calls and wiki cloning only.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ----------------------------------------------------------------
      # 2. Set up Python with pip caching for faster subsequent runs
      # ----------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ----------------------------------------------------------------
      # 3. Install Python dependencies
      # ----------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 4. Configure git identity and credentials for the push step
      # ----------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config user.name  "wiki-sync-bot"
          git config user.email "wiki-sync-bot@users.noreply.github.com"
          # Explicitly embed the PAT in the remote URL so git push authenticates
          # correctly regardless of how actions/checkout set up credentials.
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      # ----------------------------------------------------------------
      # 5. Run the sync pipeline
      # ----------------------------------------------------------------
      - name: Sync wikis
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          GH_ORG:            ${{ vars.GH_ORG }}
          REPO_FILTER:       ${{ inputs.repo_filter }}
          DRY_RUN:           ${{ inputs.dry_run }}
          LOG_LEVEL:         ${{ inputs.log_level || 'INFO' }}
          MKDOCS_SITE_NAME:  ${{ vars.MKDOCS_SITE_NAME }}
          MKDOCS_SITE_URL:   ${{ vars.MKDOCS_SITE_URL }}
          MKDOCS_REPO_URL:   ${{ vars.MKDOCS_REPO_URL }}
        run: |
          python scripts/sync_wikis.py \
            --org        "$GH_ORG" \
            --docs-dir   docs \
            --cache-dir  wiki_cache \
            --parallelism 4 \
            --log-level  "${LOG_LEVEL:-INFO}"

      # ----------------------------------------------------------------
      # 6. Detect whether docs/ or mkdocs.yml changed
      #    (skips commit + deploy if there is nothing new)
      # ----------------------------------------------------------------
      - name: Check for changes
        id: changes
        run: |
          git add docs/ mkdocs.yml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Content changes detected:"
            git diff --staged --stat
          fi

      # ----------------------------------------------------------------
      # 7. Commit updated docs to main (skipped on dry-run or no changes)
      # ----------------------------------------------------------------
      - name: Commit updated docs
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git commit -m "chore: sync wikis $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

      - name: Push to main
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: git push origin main

      # ----------------------------------------------------------------
      # 8. Build MkDocs site
      #    Run even when there are no content changes so a deploy always
      #    reflects the current state of main.
      # ----------------------------------------------------------------
      - name: Build MkDocs site
        if: inputs.dry_run != true
        run: mkdocs build

      # ----------------------------------------------------------------
      # 9. Deploy to GitHub Pages
      #    --no-history keeps gh-pages lean (no accumulating history of
      #    auto-generated content).
      # ----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force --no-history

      # ----------------------------------------------------------------
      # 10. Print a summary to the Actions run page
      # ----------------------------------------------------------------
      - name: Job summary
        if: always()
        run: |
          echo "## Wiki Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Org | \`${{ vars.GH_ORG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ inputs.dry_run || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo filter | ${{ inputs.repo_filter || '(all)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Content changed | ${{ steps.changes.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.MKDOCS_SITE_URL }}" ]; then
            echo "| Site URL | ${{ vars.MKDOCS_SITE_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
