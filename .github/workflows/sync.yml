name: Sync Wikis and Deploy

on:
  schedule:
    # Every 2 hours (at minute 0)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — discover wikis but do not commit or deploy'
        type: boolean
        default: false
      repo_filter:
        description: 'Only sync this repo (name or slug). Leave blank for all.'
        type: string
        required: false
      log_level:
        description: 'Log verbosity'
        type: choice
        default: INFO
        options: [DEBUG, INFO, WARNING, ERROR]

# Allow one sync to run at a time. Do NOT cancel in-progress runs —
# queue the next one instead. Canceling mid-sync could leave docs/ in
# a partial state and deploy an incomplete site.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write   # needed by mkdocs gh-deploy to push to gh-pages branch
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC token for Pages deployment

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout the org-docs repository
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN always has contents:write for this repo.
          # GH_PAT is reserved for GitHub API calls and wiki cloning only.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 2. Set up Python with pip caching for faster subsequent runs
      # ----------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ----------------------------------------------------------------
      # 3. Install Python dependencies
      # ----------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 4. Restore wiki_cache/ from a previous run.
      #    Saving with a unique key (run_id) ensures every successful run
      #    writes a fresh cache entry. Restoring with a prefix picks up
      #    the most recent available snapshot, so clone_wiki.py only
      #    needs to do `git fetch + reset` instead of a full clone.
      # ----------------------------------------------------------------
      - name: Restore wiki cache
        uses: actions/cache@v4
        with:
          path: wiki_cache
          key: wiki-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wiki-cache-${{ runner.os }}-

      # ----------------------------------------------------------------
      # 5. Configure git identity and credentials for the push step
      # ----------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config user.name  "wiki-sync-bot"
          git config user.email "wiki-sync-bot@users.noreply.github.com"
          # Embed the token in the remote URL so mkdocs gh-deploy can push to gh-pages.
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      # ----------------------------------------------------------------
      # 6. Run the sync pipeline
      # ----------------------------------------------------------------
      - name: Sync wikis
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          GH_ORG:            ${{ vars.GH_ORG }}
          REPO_FILTER:       ${{ inputs.repo_filter }}
          DRY_RUN:           ${{ inputs.dry_run }}
          LOG_LEVEL:         ${{ inputs.log_level || 'INFO' }}
          MKDOCS_SITE_NAME:  ${{ vars.MKDOCS_SITE_NAME }}
          MKDOCS_SITE_URL:   ${{ vars.MKDOCS_SITE_URL }}
          MKDOCS_REPO_URL:   ${{ vars.MKDOCS_REPO_URL }}
        run: |
          python scripts/sync_wikis.py \
            --org          "$GH_ORG" \
            --docs-dir     docs \
            --cache-dir    wiki_cache \
            --parallelism  4 \
            --log-level    "${LOG_LEVEL:-INFO}" \
            --summary-file sync_summary.json

      # ----------------------------------------------------------------
      # 7. Build MkDocs site directly from the synced docs/ on disk.
      #    We do NOT commit docs/ back to main — the site is always built
      #    fresh from wiki content on each run. This avoids all git race
      #    conditions between the runner and manual developer pushes.
      # ----------------------------------------------------------------
      - name: Build MkDocs site
        if: inputs.dry_run != true
        run: mkdocs build

      # ----------------------------------------------------------------
      # 8. Deploy to GitHub Pages
      #    --no-history keeps gh-pages lean (no accumulating history of
      #    auto-generated content).
      # ----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force --no-history

      # ----------------------------------------------------------------
      # 9. Print a summary to the Actions run page
      # ----------------------------------------------------------------
      - name: Job summary
        if: always()
        env:
          GH_ORG:        ${{ vars.GH_ORG }}
          EVENT_NAME:    ${{ github.event_name }}
          DRY_RUN:       ${{ inputs.dry_run || 'false' }}
          REPO_FILTER:   ${{ inputs.repo_filter || '(all)' }}
          SITE_URL:      ${{ vars.MKDOCS_SITE_URL }}
        run: |
          python - <<'PYEOF'
          import json, os, pathlib

          summary_path = pathlib.Path("sync_summary.json")
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")

          def w(line=""):
              with open(out, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          w("## Wiki Sync Summary")
          w()

          if summary_path.exists():
              d = json.loads(summary_path.read_text(encoding="utf-8"))
              w("| Field | Value |")
              w("|---|---|")
              w(f"| Repos synced \u2705 | {d['repos_ok']} |")
              w(f"| Repos skipped \u23ed\ufe0f | {d['repos_skipped']} |")
              w(f"| Repos failed \u274c | {d['repos_failed']} |")
              w(f"| Broken links \u26a0\ufe0f | {len(d['broken_links'])} |")
              w(f"| Image collisions \U0001f5bc\ufe0f | {len(d['image_collisions'])} |")

              if d['broken_links']:
                  w()
                  w("### \u26a0\ufe0f Broken links")
                  w("| Repo | File | Target |")
                  w("|---|---|---|")
                  for bl in d['broken_links']:
                      w(f"| `{bl['repo']}` | `{bl['source_file']}` | `{bl['target']}` |")

              if d['image_collisions']:
                  w()
                  w("### \U0001f5bc\ufe0f Image collisions (filename overwritten)")
                  w("| Repo | Filename |")
                  w("|---|---|")
                  for ic in d['image_collisions']:
                      w(f"| `{ic['repo']}` | `{ic['filename']}` |")

              if d['failed']:
                  w()
                  w("### \u274c Failed repos")
                  for repo in d['failed']:
                      w(f"- `{repo}`")
          else:
              w("_sync\\_summary.json not found \u2014 sync step may have failed before writing it._")

          w()
          w("---")
          org       = os.environ.get("GH_ORG", "")
          event     = os.environ.get("EVENT_NAME", "")
          dry_run   = os.environ.get("DRY_RUN", "false")
          repo_filt = os.environ.get("REPO_FILTER", "(all)")
          site_url  = os.environ.get("SITE_URL", "")
          meta = f"Org: `{org}`  |  Triggered by: `{event}`  |  Dry run: `{dry_run}`  |  Filter: `{repo_filt}`"
          if site_url:
              meta += f"  |  [Site]({site_url})"
          w(meta)
          PYEOF
